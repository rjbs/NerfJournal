<link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
<meta property="og:image" content="{{ '/assets/images/icon.png' | absolute_url }}">
<style type='text/css'>
.site-logo img, .site-logo { max-width: 32px; max-height: 32px; }
/* Constrain just-the-docs' inline SVGs at first paint so they don't balloon to
   their default 300x150 before the theme stylesheet arrives. -- claude, 2026-06-19 */
.search-icon { width: 1.2rem; height: 1.2rem; }
.nav-list-expander svg { width: 1.5rem; height: 1.5rem; }
.site-button svg, .site-title svg, svg.icon { width: 1.5rem; height: 1.5rem; }
.anchor-heading svg { width: 0.8rem; height: 0.8rem; }
</style>
<script>
  function applySystemTheme() {
    var scheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    jtd.setTheme(scheme);
  }
  document.addEventListener('DOMContentLoaded', applySystemTheme);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySystemTheme);
</script>
