# The theme and Markdown settings, and what is in extra_css, come from
# imprint, which every Semiotic Systems site shares; see its README.  This
# file must not give a list that imprint's does, like theme.features or
# markdown_extensions, which would replace imprint's without complaint.
INHERIT: ../../../semiotic-imprint/config/sectioned.yml

site_name: NerfJournal
site_description: >-
  NerfJournal, a macOS bullet journal kept on a JMAP server: the reference
  manual for its NerfCore library, and NerfLearning, a Swift and SwiftUI
  curriculum that uses it as the working example.

# The 404 page can be served at any depth, so it alone needs the site's path
# to find its style sheets, and it takes that from here.  Every other page
# links relatively.  If the site moves, change this, or the 404 page comes
# out unstyled.
site_url: https://semiotic.systems/nerfjournal/

copyright: >-
  this content generated for <a href="https://rjbs.cloud/">rjbs</a> and of
  questionable value to anybody else

# The primary color and the icon are what tell this site apart from its
# siblings.
theme:
  logo: assets/images/icon.png
  favicon: assets/images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# A new unit must be added here, or it is built but appears in no menu.  So
# must a new top-level declaration in NerfCore, and prepare fails until it is.
nav:
  - Home: index.md
  - Manual:
    - manual/index.md
    - BundleTodo: manual/BundleTodo.md
    - Category: manual/Category.md
    - CategoryColor: manual/CategoryColor.md
    - CategoryWriter: manual/CategoryWriter.md
    - CivilDate: manual/CivilDate.md
    - DatabaseExport: manual/DatabaseExport.md
    - DateParser: manual/DateParser.md
    - ExportedTodo: manual/ExportedTodo.md
    - ExportGroup: manual/ExportGroup.md
    - ExportGroupMember: manual/ExportGroupMember.md
    - groupedByCategory: manual/groupedByCategory.md
    - ImportReport: manual/ImportReport.md
    - JournalPage: manual/JournalPage.md
    - JournalSync: manual/JournalSync.md
    - JournalSyncError: manual/JournalSyncError.md
    - Moment: manual/Moment.md
    - NerfSchema: manual/NerfSchema.md
    - Swift extensions: manual/Swift.md
    - SyncedTodo: manual/SyncedTodo.md
    - SyncSettings: manual/SyncSettings.md
    - TaskBundle: manual/TaskBundle.md
    - TaskCodec: manual/TaskCodec.md
    - TaskListIndex: manual/TaskListIndex.md
    - TaskReader: manual/TaskReader.md
    - TaskWriter: manual/TaskWriter.md
    - Todo: manual/Todo.md
    - TodoEnding: manual/TodoEnding.md
  - NerfLearning:
    - learning/index.md
    - 1. Swift as a language: learning/unit-01-swift-language.md
    - 2. Views as values: learning/unit-02-views-as-values.md
    - 3. Local state and binding: learning/unit-03-state-and-binding.md
    - 4. Observable objects and stores: learning/unit-04-observable-objects.md
    - 5. App structure and multiple windows: learning/unit-05-app-structure.md
    - 6. Focus and notifications: learning/unit-06-focus-and-notifications.md
    - 7. Persistence with GRDB: learning/unit-07-persistence-grdb.md
    - 8. Undo, transactions, and correctness: learning/unit-08-undo-and-correctness.md
    - 9. Swift concurrency: learning/unit-09-swift-concurrency.md
    - 10. AppKit interoperability: learning/unit-10-appkit-interop.md
    - 11. The command-line tool: learning/unit-11-command-line-tool.md
    - 12. Swift 6: learning/unit-12-swift-6.md
    - 13. Packages, modules, and tests: learning/unit-13-packages-and-tests.md
    - "Coda: the software moved on": learning/coda.md
    - Colophon: learning/colophon.md
