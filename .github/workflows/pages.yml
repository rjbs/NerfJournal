name: Deploy learning site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'learning/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/configure-pages@v5

      - name: Install Zensical
        run: pip install -r learning/requirements.txt

      - name: Build site
        run: zensical build --clean --strict
        working-directory: learning

      - uses: actions/upload-pages-artifact@v3
        with:
          path: learning/site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
