name: Deploy the site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'doc/web/**'
      - 'NerfCore/**'
      - 'bin/docc-manual'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The manual is made by building NerfCore, which builds only on macOS,
    # and with an SDK new enough for its platform requirement.
    runs-on: xcode-27
    steps:
      # NerfCore finds Jinx at ../../Jinx, so the two are checked out side by
      # side, as they are on the machines where NerfJournal is worked on.
      - uses: actions/checkout@v4
        with:
          path: nerfjournal

      - uses: actions/checkout@v4
        with:
          repository: rjbs/jinx
          path: Jinx

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/configure-pages@v5

      - name: Install Zensical
        run: pip install -r nerfjournal/doc/web/requirements.txt

      - name: Write the manual
        run: nerfjournal/doc/web/prepare

      - name: Build site
        run: zensical build --clean --strict
        working-directory: nerfjournal/doc/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: nerfjournal/doc/web/site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
