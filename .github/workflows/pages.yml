# The site is built and deployed by imprint's workflow, which every Semiotic
# Systems site shares.  This one says when.
name: Deploy the site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'doc/web/**'
      - 'NerfCore/**'
      - 'bin/docc-manual'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    uses: rjbs/semiotic-imprint/.github/workflows/site.yml@main
    with:
      # The manual is made by building NerfCore, which builds only on macOS,
      # and with an SDK new enough for its platform requirement.
      runs-on: xcode-27
      # NerfCore finds Jinx at ../../Jinx, so the two are checked out side by
      # side, as they are on the machines where NerfJournal is worked on.
      siblings: rjbs/jinx Jinx
